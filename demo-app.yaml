apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-example-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-example-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-example-app
    spec:
      containers:
      - name: rich-metrics-app
        image: julius/prometheus-demo-service:latest
        ports:
        - containerPort: 8080
          name: web
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-example-app
  namespace: default
  labels:
    app: prometheus-example-app # MUST match the label regex in your ConfigMap!
spec:
  ports:
  - name: web
    port: 8080
    targetPort: 8080
  selector:
    app.kubernetes.io/name: prometheus-example-app
